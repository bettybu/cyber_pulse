name: Update OSINT News Daily

on:
  schedule:

    - cron: '0 8 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedparser requests

      - name: Run Python script to generate site
        run: |
          python make_site.py

      - name: Commit and push if it changed
        run: |
          git config --global user.name 'OSINT Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --cached --quiet || (git commit -m "Daily automated news update [skip ci]" && git push)